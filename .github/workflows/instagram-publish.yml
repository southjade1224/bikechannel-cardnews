name: 인스타그램 카드뉴스 게시

on:
  push:
    branches: [main]
    paths:
      - "*/publish.json"
  workflow_dispatch:
    inputs:
      folder:
        description: "게시할 폴더 이름 (예: 2026-11-23-marquez-motogp-champion)"
        required: true

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 게시할 폴더 찾기
        id: folders
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "list=${{ github.event.inputs.folder }}" >> "$GITHUB_OUTPUT"
          else
            list=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- '*/publish.json' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
            echo "list=$list" >> "$GITHUB_OUTPUT"
          fi

      - name: 인스타그램에 게시
        if: steps.folders.outputs.list != ''
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/publish_instagram.py ${{ steps.folders.outputs.list }}

      - name: 게시 기록 저장
        if: steps.folders.outputs.list != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A '*/published.json' || true
          git diff --cached --quiet || (git commit -m "인스타그램 게시 기록" && git push)
